name: Update Star trend

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public branch
        uses: actions/checkout@v4
        with:
          ref: rust-local-force

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch and render Star trend
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/update_star_trend.py

      - name: Commit updated chart
        shell: bash
        run: |
          if git diff --quiet -- assets/star-trend.svg assets/star-history.json; then
            echo "Star trend is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-trend.svg assets/star-history.json
          git commit -m "docs: update 90-day GitHub Star trend"
          git push origin HEAD:rust-local-force
